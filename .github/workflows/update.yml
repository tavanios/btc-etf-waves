name: Update data

on:
  schedule:
    - cron: "17 1,13 * * *"   # twice a day (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download BTC ETF flows (TFTC, CC BY 4.0)
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0" https://www.tftc.io/bitcoin-etf-flows/data.json -o data.new.json
          python3 -c "import json; j=json.load(open('data.new.json')); assert len(j['days']) > 100; print(j['updatedThrough'])"
          mv data.new.json data.json
      - name: Download TOTAL2 + BTC volume (TradingView)
        continue-on-error: true
        run: |
          pip install websocket-client
          python3 total2.py
      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update data
          file_pattern: data.json total2.json btc.json
